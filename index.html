<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta namae="viewpoint" content="width=device-width, initial-scale=1.0">
        <title>simple Fill Up Form</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background: #917a7a;
                display: flex;
                justify-content: center;
                height: 100vh;
                margin: 0;
            }
            .form-container {
                background: rgb(19, 121, 10);
                padding: 25px;
                border-radius: 10px;
                box-shadow: 0 4px 10px rgba(0,0,0,0,1);
                width: 350px;
            }
            h2 {
                text-align: center;
                margin-bottom: 20px;
                color: #443131;
            }
            label {
                display: block;
                margin: 10px 0 5px;
                font-weight: bold;
            }
            input, select, textarea {
                width: 100%;
                padding: 10px;
                border: 1px solid #css;
                border-radius: 6px;
                box-sizing: border-box;
            }
            button {
                width: 100%;
                padding: 12px;
                margin-bottom: 15px;
                background: #af4caa;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 16px;
                cursor: pointer;
            }
            button:hover {
                background: 45a049;
            }
            </style>
        </head>
    <body>

        <div class="form-container">
            <h2>Registration Form</h2>

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="peter jackson" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="peterjack@email.com" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="09060850457">

                <label for="gender"> Gender</label>
                <select id="gender" name="gender">
                    <option value="">Select</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Prefer not to say</option>
                </select>

                <label for="message">message</label>
                <textarea id="message" name="message" name="message" rows="3" placeholder="Write something..."></textarea>

                <button type="submit">Submit</button>
            
        </div>
    
    </body>
    </html>
